<svg viewBox="0 0 800 880" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadowWF" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="880" fill="#F8FAFC"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">How Triage Works</text>

  <line x1="70" y1="172" x2="70" y2="756" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Step 1 -->
  <circle cx="70" cy="144" r="28" fill="#06B6D4" filter="url(#shadowWF)"/>
  <text x="70" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">01</text>
  <rect x="130" y="90" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="90" width="6" height="108" rx="3" fill="#06B6D4"/>
  <text x="160" y="130" font-size="16" font-weight="700" fill="#0F172A">Customer Query</text>
  <text x="160" y="156" font-size="12.5" fill="#64748B">Customer describes the issue through text or voice.</text>

  <!-- Step 2 -->
  <circle cx="70" cy="272" r="28" fill="#8B5CF6" filter="url(#shadowWF)"/>
  <text x="70" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">02</text>
  <rect x="130" y="218" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="218" width="6" height="108" rx="3" fill="#8B5CF6"/>
  <text x="160" y="258" font-size="16" font-weight="700" fill="#0F172A">AI Understanding</text>
  <text x="160" y="284" font-size="12.5" fill="#64748B">Gemini analyzes the conversation and determines intent.</text>

  <!-- Step 3 -->
  <circle cx="70" cy="400" r="28" fill="#4285F4" filter="url(#shadowWF)"/>
  <text x="70" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">03</text>
  <rect x="130" y="346" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="346" width="6" height="108" rx="3" fill="#4285F4"/>
  <text x="160" y="386" font-size="16" font-weight="700" fill="#0F172A">AI Assistance</text>
  <text x="160" y="412" font-size="12.5" fill="#64748B">Triage provides relevant troubleshooting and guidance.</text>

  <!-- Step 4 -->
  <circle cx="70" cy="528" r="28" fill="#F59E0B" filter="url(#shadowWF)"/>
  <text x="70" y="534" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">04</text>
  <rect x="130" y="474" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="474" width="6" height="108" rx="3" fill="#F59E0B"/>
  <text x="160" y="514" font-size="16" font-weight="700" fill="#0F172A">Resolution Check</text>
  <text x="160" y="540" font-size="12.5" fill="#64748B">If the issue is resolved, the conversation is completed.</text>

  <!-- Step 5 -->
  <circle cx="70" cy="656" r="28" fill="#F43F5E" filter="url(#shadowWF)"/>
  <text x="70" y="662" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">05</text>
  <rect x="130" y="602" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="602" width="6" height="108" rx="3" fill="#F43F5E"/>
  <text x="160" y="642" font-size="16" font-weight="700" fill="#0F172A">Human Escalation</text>
  <text x="160" y="668" font-size="12.5" fill="#64748B">If needed, the issue is escalated into a support ticket.</text>

  <!-- Step 6 -->
  <circle cx="70" cy="784" r="28" fill="#10B981" filter="url(#shadowWF)"/>
  <text x="70" y="790" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">06</text>
  <rect x="130" y="730" width="630" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="130" y="730" width="6" height="108" rx="3" fill="#10B981"/>
  <text x="160" y="770" font-size="16" font-weight="700" fill="#0F172A">Ticket Management</text>
  <text x="160" y="796" font-size="12.5" fill="#64748B">The customer tracks the issue from the dashboard.</text>
</svg>
